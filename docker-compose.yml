version: '3.8'

services:
  db:
    container_name: wyn-db
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wyn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wyn-network

  api:
    container_name: wyn-api
    image: wyn-api-fixed
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wyn?schema=public
      JWT_SECRET: super_secret_key_change_in_production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./public:/app/public
    networks:
      - wyn-network

networks:
  wyn-network:
    driver: bridge

volumes:
  postgres_data: 